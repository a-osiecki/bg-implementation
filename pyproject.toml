[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg-pricing"
version = "0.1.0"
description = "Implementación de estudio del método de Broadie-Glasserman para opciones americanas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agustín Osiecki" }]
keywords = ["finanzas cuantitativas", "opciones americanas", "Monte Carlo", "Broadie-Glasserman"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bg-pricing = "bg_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
